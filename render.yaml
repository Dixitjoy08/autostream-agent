services:
  - type: web
    name: autostream-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: GOOGLE_API_KEY
        sync: false          # You will set this manually in Render dashboard
      - key: SF_USERNAME
        sync: false
      - key: SF_PASSWORD
        sync: false
      - key: SF_SECURITY_TOKEN
        sync: false
